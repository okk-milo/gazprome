server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /local-llm/ {
    proxy_pass http://host.docker.internal:8081/;
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
